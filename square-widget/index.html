<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Normalized Mouse Coordinates</title>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1a1a;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, Helvetica, sans-serif;
      }

      #container {
        position: relative;
        width: 300px;
        height: 300px;
      }

      #square {
        position: absolute;
        inset: 0;
        border: 2px solid white;
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
        pointer-events: none;
      }

      #letter {
        color: white;
        font-size: 120px;
        font-weight: bold;
        user-select: none;
        line-height: 1;
      }

      #tracker {
        position: absolute;
        inset: 0;
        background: transparent;
        cursor: crosshair;
      }

      #coords {
        position: fixed;
        color: #00ff80;
        font: 14px monospace;
        white-space: nowrap;
        pointer-events: none;
        display: none;
        text-shadow: 0 0 3px black;
      }
    </style>
  </head>

  <body>
    <div id="container">
      <div id="square">
        <div id="letter">A</div>
      </div>

      <div id="tracker"></div>
    </div>

    <div id="coords"></div>

    <script>
      const tracker = document.getElementById("tracker");
      const coords = document.getElementById("coords");

      tracker.addEventListener("mouseenter", () => {
        coords.style.display = "block";
      });

      tracker.addEventListener("mouseleave", () => {
        coords.style.display = "none";
      });

      tracker.addEventListener("mousemove", (e) => {
        const r = tracker.getBoundingClientRect();

        // Normalize to 0.0 - 1.0
        const x = (e.clientX - r.left) / r.width;
        const y = (e.clientY - r.top) / r.height;

        coords.textContent = `x=${x.toFixed(3)}  y=${y.toFixed(3)}`;

        coords.style.left = e.clientX + 14 + "px";
        coords.style.top = e.clientY + 14 + "px";
      });
    </script>
  </body>
</html>
