<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #111;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .box {
        position: relative;
        width: 300px;
        height: 300px;
      }

      .segment {
        position: absolute;
        background: white;
      }

      /* Horizontal thickness */
      .h {
        height: 5px;
      }

      /* Vertical thickness */
      .v {
        width: 5px;
      }

      /* Top */
      .tl {
        top: 0;
        left: 0;
        width: 35%;
      }
      .tr {
        top: 0;
        right: 0;
        width: 35%;
      }

      /* Bottom */
      .bl {
        bottom: 0;
        left: 0;
        width: 35%;
      }
      .br {
        bottom: 0;
        right: 0;
        width: 35%;
      }

      /* Left */
      .lt {
        left: 0;
        top: 0;
        height: 35%;
      }
      .lb {
        left: 0;
        bottom: 0;
        height: 35%;
      }

      /* Right */
      .rt {
        right: 0;
        top: 0;
        height: 35%;
      }
      .rb {
        right: 0;
        bottom: 0;
        height: 35%;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="segment h tl"></div>
      <div class="segment h tr"></div>
      <div class="segment h bl"></div>
      <div class="segment h br"></div>

      <div class="segment v lt"></div>
      <div class="segment v lb"></div>
      <div class="segment v rt"></div>
      <div class="segment v rb"></div>
    </div>
  </body>
</html>
