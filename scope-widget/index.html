<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        user-select: none;
        font-family: Arial, Helvetica, sans-serif;
      }

      .container {
        position: relative;
        width: 700px;
        height: 350px;
        border: 2px solid #444;
        background: #1e1e1e;
        overflow: hidden;
      }

      .scopeWidget {
        position: absolute;
        width: 175px;
        height: 175px;
        cursor: grab;
        touch-action: none;
        z-index: 2;
        background: transparent;
      }

      .segment {
        position: absolute;
        background: white;
        pointer-events: none;
        z-index: 3;
      }

      .h {
        height: 5px;
      }

      .v {
        width: 5px;
      }

      .tl {
        top: 0;
        left: 0;
        width: 35%;
      }

      .tr {
        top: 0;
        right: 0;
        width: 35%;
      }

      .bl {
        bottom: 0;
        left: 0;
        width: 35%;
      }

      .br {
        bottom: 0;
        right: 0;
        width: 35%;
      }

      .lt {
        left: 0;
        top: 0;
        height: 35%;
      }

      .lb {
        left: 0;
        bottom: 0;
        height: 35%;
      }

      .rt {
        right: 0;
        top: 0;
        height: 35%;
      }

      .rb {
        right: 0;
        bottom: 0;
        height: 35%;
      }

      .grid {
        position: absolute;
        inset: 0px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: 1px;
        z-index: 1;
        pointer-events: none;
      }

      .cell {
        border: 1px solid #777;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 60px;
        box-sizing: border-box;
        user-select: none;
        cursor: pointer;
        pointer-events: auto;
        transition:
          background-color 180ms ease,
          border-color 180ms ease;
      }

      .cell.selected {
        background: rgba(255, 255, 255, 0.2);
        border-color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="scopeWidget">
        <div class="segment h tl"></div>
        <div class="segment h tr"></div>
        <div class="segment h bl"></div>
        <div class="segment h br"></div>

        <div class="segment v lt"></div>
        <div class="segment v lb"></div>
        <div class="segment v rt"></div>
        <div class="segment v rb"></div>
      </div>

      <div class="grid">
        <div class="cell">A</div>
        <div class="cell">B</div>
        <div class="cell">C</div>
        <div class="cell">D</div>
        <div class="cell">E</div>
        <div class="cell">F</div>
        <div class="cell">G</div>
        <div class="cell">H</div>
      </div>
    </div>

    <script>
      const container = document.querySelector(".container");
      const widget = document.querySelector(".scopeWidget");
      const cells = Array.from(document.querySelectorAll(".cell"));

      let dragging = false;
      let offsetX = 0;
      let offsetY = 0;
      let selectedCell = null;
      let dragPointerId = null;
      let movedDuringDrag = false;
      let pointerDownX = 0;
      let pointerDownY = 0;

      const DRAG_THRESHOLD = 3;

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function clampWidgetPosition(left, top) {
        const containerRect = container.getBoundingClientRect();
        const widgetWidth = widget.offsetWidth;
        const widgetHeight = widget.offsetHeight;
        const thickness = 5;

        const maxLeft = Math.max(
          0,
          containerRect.width - widgetWidth - thickness,
        );
        const maxTop = Math.max(
          0,
          containerRect.height - widgetHeight - thickness,
        );

        return {
          left: clamp(left, 0, maxLeft),
          top: clamp(top, 0, maxTop),
        };
      }

      function positionWidgetAtCell(cell) {
        const containerRect = container.getBoundingClientRect();
        const cellRect = cell.getBoundingClientRect();
        const widgetWidth = widget.offsetWidth;
        const widgetHeight = widget.offsetHeight;

        const left =
          cellRect.left -
          containerRect.left +
          (cellRect.width - widgetWidth) / 2;
        const top =
          cellRect.top -
          containerRect.top +
          (cellRect.height - widgetHeight) / 2;

        const { left: clampedLeft, top: clampedTop } = clampWidgetPosition(
          left,
          top,
        );

        widget.style.left = `${clampedLeft}px`;
        widget.style.top = `${clampedTop}px`;
      }

      function setSelectedCell(cell, options = {}) {
        const { snapWidget = false } = options;

        if (selectedCell && selectedCell !== cell) {
          selectedCell.classList.remove("selected");
        }

        selectedCell = cell;

        if (selectedCell) {
          selectedCell.classList.add("selected");
        }

        if (snapWidget && selectedCell) {
          positionWidgetAtCell(selectedCell);
        }
      }

      function selectCell(cell) {
        setSelectedCell(cell, { snapWidget: true });
      }

      function findCellUnderPoint(clientX, clientY) {
        const elements = document.elementsFromPoint(clientX, clientY);
        const cell = elements.find((element) =>
          element.classList.contains("cell"),
        );
        return cell || null;
      }

      function getCellUnderWidget() {
        const rect = widget.getBoundingClientRect();
        const x = rect.left + rect.width / 2;
        const y = rect.top + rect.height / 2;
        return findCellUnderPoint(x, y);
      }

      function updateSelectionFromWidget() {
        const cell = getCellUnderWidget();
        if (cell && cell !== selectedCell) {
          setSelectedCell(cell);
        }
      }

      cells.forEach((cell) => {
        cell.addEventListener("pointerdown", (event) => {
          event.stopPropagation();
          selectCell(cell);
        });

        cell.addEventListener("click", (event) => {
          event.stopPropagation();
          selectCell(cell);
        });
      });

      setSelectedCell(cells[0], { snapWidget: true });

      widget.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;

        dragging = true;
        movedDuringDrag = false;
        dragPointerId = event.pointerId;
        pointerDownX = event.clientX;
        pointerDownY = event.clientY;

        const rect = widget.getBoundingClientRect();
        offsetX = event.clientX - rect.left;
        offsetY = event.clientY - rect.top;

        widget.style.cursor = "grabbing";
        widget.setPointerCapture(event.pointerId);
        event.preventDefault();
      });

      widget.addEventListener("pointermove", (event) => {
        if (!dragging || event.pointerId !== dragPointerId) return;

        const dx = event.clientX - pointerDownX;
        const dy = event.clientY - pointerDownY;

        if (
          !movedDuringDrag &&
          (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD)
        ) {
          movedDuringDrag = true;
        }

        const containerRect = container.getBoundingClientRect();
        let left = event.clientX - containerRect.left - offsetX;
        let top = event.clientY - containerRect.top - offsetY;

        const { left: clampedLeft, top: clampedTop } = clampWidgetPosition(
          left,
          top,
        );

        widget.style.left = `${clampedLeft}px`;
        widget.style.top = `${clampedTop}px`;

        updateSelectionFromWidget();
      });

      function endDrag(event) {
        if (!dragging || event.pointerId !== dragPointerId) return;

        dragging = false;
        dragPointerId = null;

        if (!movedDuringDrag) {
          const cell = findCellUnderPoint(event.clientX, event.clientY);
          if (cell) {
            selectCell(cell);
          }
        }

        widget.style.cursor = "grab";
        if (widget.hasPointerCapture?.(event.pointerId)) {
          widget.releasePointerCapture(event.pointerId);
        }
      }

      widget.addEventListener("pointerup", endDrag);
      widget.addEventListener("pointercancel", endDrag);

      window.addEventListener("blur", () => {
        dragging = false;
        dragPointerId = null;
        widget.style.cursor = "grab";
      });
    </script>
  </body>
</html>
