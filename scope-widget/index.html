<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        user-select: none;
      }

      .container {
        position: relative;
        width: 700px;
        height: 350px;
        border: 2px solid #444;
        background: #1e1e1e;
        overflow: hidden;
      }

      .scopeWidget {
        position: absolute;
        width: 175px;
        height: 175px;
        top: 20px;
        left: 20px;
        cursor: grab;
        touch-action: none;
      }

      .segment {
        position: absolute;
        background: white;
      }

      /* Horizontal thickness */
      .h {
        height: 5px;
      }

      /* Vertical thickness */
      .v {
        width: 5px;
      }

      /* Top */
      .tl {
        top: 0;
        left: 0;
        width: 35%;
      }
      .tr {
        top: 0;
        right: 0;
        width: 35%;
      }

      /* Bottom */
      .bl {
        bottom: 0;
        left: 0;
        width: 35%;
      }
      .br {
        bottom: 0;
        right: 0;
        width: 35%;
      }

      /* Left */
      .lt {
        left: 0;
        top: 0;
        height: 35%;
      }
      .lb {
        left: 0;
        bottom: 0;
        height: 35%;
      }

      /* Right */
      .rt {
        right: 0;
        top: 0;
        height: 35%;
      }
      .rb {
        right: 0;
        bottom: 0;
        height: 35%;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="scopeWidget">
        <div class="segment h tl"></div>
        <div class="segment h tr"></div>
        <div class="segment h bl"></div>
        <div class="segment h br"></div>

        <div class="segment v lt"></div>
        <div class="segment v lb"></div>
        <div class="segment v rt"></div>
        <div class="segment v rb"></div>
      </div>
    </div>

    <script>
      const container = document.querySelector(".container");
      const widget = document.querySelector(".scopeWidget");

      let dragging = false;
      let offsetX = 0;
      let offsetY = 0;

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      widget.addEventListener("mousedown", (event) => {
        dragging = true;
        widget.style.cursor = "grabbing";

        const rect = widget.getBoundingClientRect();
        offsetX = event.clientX - rect.left;
        offsetY = event.clientY - rect.top;

        event.preventDefault();
      });

      document.addEventListener("mousemove", (event) => {
        if (!dragging) return;

        const containerRect = container.getBoundingClientRect();
        const widgetWidth = widget.offsetWidth;
        const widgetHeight = widget.offsetHeight;

        let left = event.clientX - containerRect.left - offsetX;
        let top = event.clientY - containerRect.top - offsetY;

        left = clamp(left, 0, containerRect.width - widgetWidth);
        top = clamp(top, 0, containerRect.height - widgetHeight);

        widget.style.left = `${left}px`;
        widget.style.top = `${top}px`;
      });

      document.addEventListener("mouseup", () => {
        if (!dragging) return;
        dragging = false;
        widget.style.cursor = "grab";
      });

      window.addEventListener("blur", () => {
        dragging = false;
        widget.style.cursor = "grab";
      });
    </script>
  </body>
</html>
