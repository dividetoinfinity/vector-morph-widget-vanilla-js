<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        user-select: none;
        font-family: Arial, Helvetica, sans-serif;
      }

      .container {
        position: relative;
        width: 700px;
        height: 350px;
        border: 2px solid #444;
        background: #1e1e1e;
        overflow: hidden;
      }

      .scopeWidget {
        position: absolute;
        width: 175px;
        height: 175px;
        cursor: grab;
        touch-action: none;
      }

      .segment {
        position: absolute;
        background: white;
      }

      /* Horizontal thickness */
      .h {
        height: 5px;
      }

      /* Vertical thickness */
      .v {
        width: 5px;
      }

      /* Top */
      .tl {
        top: 0;
        left: 0;
        width: 35%;
      }
      .tr {
        top: 0;
        right: 0;
        width: 35%;
      }

      /* Bottom */
      .bl {
        bottom: 0;
        left: 0;
        width: 35%;
      }
      .br {
        bottom: 0;
        right: 0;
        width: 35%;
      }

      /* Left */
      .lt {
        left: 0;
        top: 0;
        height: 35%;
      }
      .lb {
        left: 0;
        bottom: 0;
        height: 35%;
      }

      /* Right */
      .rt {
        right: 0;
        top: 0;
        height: 35%;
      }
      .rb {
        right: 0;
        bottom: 0;
        height: 35%;
      }
      /* Grid */
      .grid {
        position: absolute;
        left: 7px;
        top: 7px;
        /* transform: translate(-50%, -50%); */
        width: 600px;
        height: 300px;
        display: grid;
        grid-template-columns: repeat(4, 160px);
        grid-template-rows: repeat(2, 160px);
        gap: 15px;
        z-index: 2;
        pointer-events: none;
      }

      .cell {
        border: 1px solid #777;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 60px;
        box-sizing: border-box;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="scopeWidget">
        <div class="segment h tl"></div>
        <div class="segment h tr"></div>
        <div class="segment h bl"></div>
        <div class="segment h br"></div>

        <div class="segment v lt"></div>
        <div class="segment v lb"></div>
        <div class="segment v rt"></div>
        <div class="segment v rb"></div>
      </div>
      <div class="grid">
        <div class="cell">A</div>
        <div class="cell">B</div>
        <div class="cell">C</div>
        <div class="cell">D</div>
        <div class="cell">E</div>
        <div class="cell">F</div>
        <div class="cell">G</div>
        <div class="cell">H</div>
      </div>
    </div>

    <script>
      const container = document.querySelector(".container");
      const widget = document.querySelector(".scopeWidget");

      let dragging = false;
      let offsetX = 0;
      let offsetY = 0;

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      widget.addEventListener("mousedown", (event) => {
        dragging = true;
        widget.style.cursor = "grabbing";

        const rect = widget.getBoundingClientRect();
        offsetX = event.clientX - rect.left;
        offsetY = event.clientY - rect.top;

        event.preventDefault();
      });

      document.addEventListener("mousemove", (event) => {
        if (!dragging) return;

        const containerRect = container.getBoundingClientRect();
        const widgetWidth = widget.offsetWidth;
        const widgetHeight = widget.offsetHeight;
        const thickness = 5;

        let left = event.clientX - containerRect.left - offsetX;
        let top = event.clientY - containerRect.top - offsetY;

        const maxLeft = containerRect.width - widgetWidth - thickness;
        const maxTop = containerRect.height - widgetHeight - thickness;

        left = clamp(left, 0, maxLeft);
        top = clamp(top, 0, maxTop);

        widget.style.left = `${left}px`;
        widget.style.top = `${top}px`;
      });

      document.addEventListener("mouseup", () => {
        if (!dragging) return;
        dragging = false;
        widget.style.cursor = "grab";
      });

      window.addEventListener("blur", () => {
        dragging = false;
        widget.style.cursor = "grab";
      });
    </script>
  </body>
</html>
