<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Normalized Mouse Tracker</title>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #202020;
        font-family: Arial, Helvetica, sans-serif;
      }

      /* Center the tracking rectangle */
      #trackingArea {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 700px;
        height: 450px;
        transform: translate(-50%, -50%);

        background: transparent;
        border: 2px dashed rgba(255, 255, 255, 0.35);
        box-sizing: border-box;
      }

      /* Floating coordinate label */
      #mouseLabel {
        position: fixed;
        pointer-events: none;

        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        padding: 5px 8px;
        border-radius: 5px;
        font-size: 14px;
        white-space: nowrap;

        transform: translate(15px, 15px);
      }
    </style>
  </head>

  <body>
    <div id="trackingArea"></div>
    <div id="mouseLabel">x=0.000 y=0.000</div>

    <script>
      const area = document.getElementById("trackingArea");
      const label = document.getElementById("mouseLabel");

      area.addEventListener("mousemove", (e) => {
        const rect = area.getBoundingClientRect();

        let x = (e.clientX - rect.left) / rect.width;
        let y = (e.clientY - rect.top) / rect.height;

        // Clamp to [0,1]
        x = Math.min(1, Math.max(0, x));
        y = Math.min(1, Math.max(0, y));

        label.style.left = e.clientX + "px";
        label.style.top = e.clientY + "px";

        label.textContent = `x=${x.toFixed(3)}  y=${y.toFixed(3)}`;
      });

      area.addEventListener("mouseleave", () => {
        label.textContent = "Outside tracking area";
      });
    </script>
  </body>
</html>
