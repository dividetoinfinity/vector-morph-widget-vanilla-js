<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vector Morph Widget</title>
    <style>
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #202020;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, Helvetica, sans-serif;
      }

      /* Center the tracking rectangle */
      #vectorMorphTrackingArea {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 700px;
        height: 350px;
        transform: translate(-50%, -50%);

        background: transparent;
        border: 2px solid rgba(255, 255, 255, 0.35);
        box-sizing: border-box;
      }

      /* Floating coordinate label */
      #vectorMorphMouseLabel {
        position: fixed;
        pointer-events: none;

        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        padding: 5px 8px;
        border-radius: 5px;
        font-size: 14px;
        white-space: nowrap;

        transform: translate(15px, 15px);
      }

      .scopeWidget {
        position: relative;
        width: 175px;
        height: 175px;
      }

      .segment {
        position: absolute;
        background: white;
      }

      /* Horizontal thickness */
      .h {
        height: 5px;
      }

      /* Vertical thickness */
      .v {
        width: 5px;
      }

      /* Top */
      .tl {
        top: 0;
        left: 0;
        width: 35%;
      }
      .tr {
        top: 0;
        right: 0;
        width: 35%;
      }

      /* Bottom */
      .bl {
        bottom: 0;
        left: 0;
        width: 35%;
      }
      .br {
        bottom: 0;
        right: 0;
        width: 35%;
      }

      /* Left */
      .lt {
        left: 0;
        top: 0;
        height: 35%;
      }
      .lb {
        left: 0;
        bottom: 0;
        height: 35%;
      }

      /* Right */
      .rt {
        right: 0;
        top: 0;
        height: 35%;
      }
      .rb {
        right: 0;
        bottom: 0;
        height: 35%;
      }
      /* Box Widget */
      #boxWidget {
        position: relative;
        width: 175px;
        height: 175px;
      }

      #square {
        position: absolute;
        inset: 0;
        border: 2px solid white;
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
        pointer-events: none;
      }

      #letter {
        color: white;
        font-size: 60px;
        font-weight: bold;
        user-select: none;
        line-height: 1;
      }

      #boxTracker {
        position: absolute;
        inset: 0;
        background: transparent;
        cursor: crosshair;
      }

      #boxCoords {
        position: fixed;
        color: #00ff80;
        font: 14px monospace;
        white-space: nowrap;
        pointer-events: none;
        display: none;
        text-shadow: 0 0 3px black;
      }
    </style>
  </head>

  <body>
    <!-- VectorMorph Bounded Area -->
    <div id="vectorMorphTrackingArea"></div>
    <div id="vectorMorphMouseLabel">x=0.000 y=0.000</div>

    <!-- Scope Widget -->
    <div class="scopeWidget">
      <div class="segment h tl"></div>
      <div class="segment h tr"></div>
      <div class="segment h bl"></div>
      <div class="segment h br"></div>

      <div class="segment v lt"></div>
      <div class="segment v lb"></div>
      <div class="segment v rt"></div>
      <div class="segment v rb"></div>
    </div>

    <!-- Box Widget -->
    <div id="boxWidget">
      <div id="square">
        <div id="letter">A</div>
      </div>

      <div id="boxTracker"></div>
    </div>

    <div id="boxCoords"></div>

    <script>
      // VectorMorph Bounds
      const area = document.getElementById("vectorMorphTrackingArea");
      const label = document.getElementById("vectorMorphMouseLabel");

      area.addEventListener("mousemove", (e) => {
        const rect = area.getBoundingClientRect();

        let x = (e.clientX - rect.left) / rect.width;
        let y = (e.clientY - rect.top) / rect.height;

        // Clamp to [0,1]
        x = Math.min(1, Math.max(0, x));
        y = Math.min(1, Math.max(0, y));

        label.style.left = e.clientX + "px";
        label.style.top = e.clientY + "px";

        label.textContent = `x=${x.toFixed(3)}  y=${y.toFixed(3)}`;
      });

      area.addEventListener("mouseleave", () => {
        label.textContent = "Outside VectorMorph tracking area";
      });

      // Box Widget
      const boxTracker = document.getElementById("boxTracker");
      const boxCoords = document.getElementById("boxCoords");

      boxTracker.addEventListener("mouseenter", () => {
        boxCoords.style.display = "block";
      });

      boxTracker.addEventListener("mouseleave", () => {
        boxCoords.style.display = "none";
      });

      boxTracker.addEventListener("mousemove", (e) => {
        const r = boxTracker.getBoundingClientRect();

        // Normalize to 0.0 - 1.0
        const x = (e.clientX - r.left) / r.width;
        const y = (e.clientY - r.top) / r.height;

        boxCoords.textContent = `x=${x.toFixed(3)}  y=${y.toFixed(3)}`;

        boxCoords.style.left = e.clientX + 14 + "px";
        boxCoords.style.top = e.clientY + 14 + "px";
      });
    </script>
  </body>
</html>
